# Synthetic multi-document RAG workload for provisional Gate G0.
# Documented recurrence stats — replace with a real serving trace when available.

name: synthetic_rag_default
seed: 42
num_requests: 500
corpus_size: 80

chunk_len_min: 256
chunk_len_max: 4096
chunk_len_median_target: 768

docs_per_request_min: 1

# Primary model target for Phase 0B.
# Official weights: meta-llama/Llama-3.1-8B-Instruct (HF gated).
# Desk config fetched from NousResearch/Meta-Llama-3.1-8B-Instruct mirror
# (configs/models/fetched/llama31_8b_instruct.config.json) — re-verify against
# official config.json after HF auth.

name: llama-3.1-8b-instruct
hf_repo: meta-llama/Llama-3.1-8B-Instruct
role: primary
params_b: 8
dtype_target: bf16
attention: gqa
num_attention_heads: 32
num_key_value_heads: 8
num_hidden_layers: 32
hidden_size: 4096
positional: rope
rope_theta: 500000.0
rope_scaling:
  rope_type: llama3
  factor: 8.0
  low_freq_factor: 1.0
  high_freq_factor: 4.0
  original_max_position_embeddings: 8192
max_position_embeddings: 131072
# PRD prefers unscaled RoPE for first Case A/B; this checkpoint is length-scaled.
# Treat scaled-RoPE as a separate Phase 1 variant; document convention carefully.
phase1_note: scaled_rope_llama3_variant
config_source: configs/models/fetched/llama31_8b_instruct.config.json
notes: >
  GQA full-attention decoder — in research scope. rope_scaling.rope_type=llama3 is
  allowed in Phase 0/1 (static θ_i after scaling is fixed; v2.1 §I). factor 8 still
  needs measurement; isolate unscaled
  behavior or account for scaling in rotation tests.
